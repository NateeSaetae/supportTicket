services:
  db:
    image: postgres:17
    container_name: support_ticket_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: support_ticket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: